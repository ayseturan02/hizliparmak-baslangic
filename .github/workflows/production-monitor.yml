name: Production health monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check website and database/cache health
        env:
          SITE_URL: https://hizliparmak-baslangic.vercel.app
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 30 "$SITE_URL/" --output /dev/null
          curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 30 "$SITE_URL/api/health" --output /dev/null
