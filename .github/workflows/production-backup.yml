name: Production encrypted backup
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'
permissions:
  contents: read
concurrency:
  group: production-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-restore-only
          POSTGRES_DB: restore_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Prepare isolated local restore target
        run: echo 'DATABASE_URL="postgresql://postgres:ci-restore-only@localhost:5432/restore_check?schema=public"' > .env
      - name: Encrypt snapshot and verify every restored record
        run: npm run db:backup -- --verify-local
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-${{ github.run_id }}
          path: .vercel/backups/*.hpbackup
          if-no-files-found: error
          retention-days: 30
